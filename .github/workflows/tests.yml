name: Bot checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - name: Verify the actual release and complete package
        run: |
          python scripts/check_release.py --data-dir "$RUNNER_TEMP/unused-state"
          python scripts/build_package.py "$RUNNER_TEMP/Adventures-verified.zip"
          python scripts/check_package.py "$RUNNER_TEMP/Adventures-verified.zip"
