name: Bot checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
  windows-removal-preview:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Parse the Windows removal script without executing it
        shell: powershell
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile("$PWD\scripts\remove_python_windows.ps1", [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors.Count) { $errors | Format-List; exit 1 }
      - name: Preview only - never uninstall runner software
        shell: powershell
        run: .\scripts\remove_python_windows.ps1 -Preview
